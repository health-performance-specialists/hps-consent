name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run test:php
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hps-consent
          path: dist/*
  release:
    concurrency: hps-consent-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check release request
        id: request
        run: |
          if git diff --name-only HEAD^ HEAD -- .github/release-version | grep -q .; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.request.outputs.publish == 'true'
        with:
          name: hps-consent
          path: dist
      - name: Verify release version
        if: steps.request.outputs.publish == 'true'
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(tr -d '\r\n' < .github/release-version)" = "$version"
          tr -d '\r' < hps-consent.php | grep -Fx " * Version: $version"
          tr -d '\r' < readme.txt | grep -Fx "Stable tag: $version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish installable WordPress package
        if: steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" dist/hps-consent.zip dist/hps-consent.zip.sha256 --target "$GITHUB_SHA" --title "HPS Consent $RELEASE_TAG" --generate-notes
          fi
