name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:php
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hps-consent
          path: dist/*
  release:
    concurrency: hps-consent-release
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check release request
        id: request
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/v* ]] || git diff --name-only HEAD^ HEAD -- .github/release-version | grep -q .; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.publish == 'true'
        with:
          name: hps-consent
          path: dist
      - name: Verify release version
        if: steps.request.outputs.publish == 'true'
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(tr -d '\r\n' < .github/release-version)" = "$version"
          tr -d '\r' < hps-consent.php | grep -Fx " * Version: $version"
          tr -d '\r' < readme.txt | grep -Fx "Stable tag: $version"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_REF" = "refs/tags/v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish installable WordPress package
        if: steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" dist/hps-consent.zip dist/hps-consent.zip.sha256 --target "$GITHUB_SHA" --title "HPS Consent $RELEASE_TAG" --generate-notes
          fi
